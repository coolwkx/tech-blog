site_name: 技术复习笔记
site_description: Python / 数据处理 / 机器学习 / 深度学习 / NLP / 大模型 / Agent / 项目实战 复习笔记
site_author: 王凯旋
repo_url: https://github.com/coolwkx/tech-blog
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tooltips
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  # 不配置 font：Material 默认走 Google Fonts，国内访问不稳定；
  # 中文字体改由 stylesheets/extra.css 里的系统字体栈处理
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      separator: '[\s\u200b\-、。，；：！？（）《》【】]'

extra_javascript:
  # mathjax.js：配置 MathJax 并优先加载仓库内置的 tex-mml-chtml.js（离线可用），CDN 仅作兜底
  - javascripts/mathjax.js
  # mermaid.js：初始化 Mermaid 并按多源回退加载（Mermaid 无法单文件离线加载）
  - javascripts/mermaid.js

